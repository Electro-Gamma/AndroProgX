plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Release signing. The release build is signed with your own key when ANDROPROGX_KEYSTORE points at a real
// keystore file (the Colab notebook generates one and sets these variables). Without it nothing changes:
// assembleRelease produces an UNSIGNED apk, which Android refuses to install, and assembleDebug is untouched
// (debug key). Store and key password are expected to be the same value (a PKCS12 keystore, keytool's default,
// ignores a different key password).
def releaseKeystorePath = System.getenv('ANDROPROGX_KEYSTORE')
def hasReleaseKeystore = releaseKeystorePath != null && new File(releaseKeystorePath).isFile()

android {
    namespace 'com.androprogx.app'
    compileSdk 35

    defaultConfig {
        applicationId "com.androprogx.app"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('ANDROPROGX_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROPROGX_KEY_ALIAS')
                keyPassword System.getenv('ANDROPROGX_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding true
    }

    packaging {
        resources {
            excludes += ['/META-INF/AL2.0', '/META-INF/LGPL2.1']
        }
    }

    // Force the built artifact to be literally named AndroProgX.apk
    applicationVariants.all { variant ->
        variant.outputs.all { output ->
            outputFileName = "AndroProgX.apk"
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.8.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'

    // USB Serial: CH340, CP210x, FTDI FT232, PL2303, CDC-ACM (ESP32 native USB)
    implementation 'com.github.mik3y:usb-serial-for-android:3.7.0'
}
